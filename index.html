<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công cụ Mail Merge Trộn Biểu Mẫu Word & Excel</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome 6 Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <!-- DataTables Bootstrap 5 CSS -->
    <link href="https://cdn.datatables.net/1.13.7/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <!-- SweetAlert2 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card-custom { border: none; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
        .upload-box { border: 2px dashed #cbd5e1; border-radius: 8px; padding: 20px; text-align: center; background-color: #f8fafc; transition: all 0.3s; }
        .upload-box:hover { border-color: #198754; background-color: #f0fdf4; }
        .table-responsive { max-height: 400px; }
        .badge-special { font-size: 0.8rem; margin-right: 4px; }
    </style>
</head>
<body>

<div class="container py-5">
    <!-- Header -->
    <div class="text-center mb-4">
        <h2 class="fw-bold text-success"><i class="fa-solid fa-file-excel me-2"></i>Trộn Biểu Mẫu Word & Excel</h2>
        <p class="text-muted">Hỗ trợ tự động định dạng: 
            <span class="badge bg-primary badge-special">BieuMau</span>
            <span class="badge bg-warning text-dark badge-special">TrangThai</span>
            <span class="badge bg-info text-dark badge-special">DauPhanCachPhanNghin (VN/US)</span>
        </p>
    </div>

    <!-- Main Card -->
    <div class="card card-custom p-4 mb-4">
        <form id="mergeForm">
            <div class="row g-4 mb-4">
                <!-- Excel File Upload (Bắt buộc) -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold"><i class="fa-solid fa-file-excel text-success me-2"></i>1. Tệp Excel Dữ Liệu (.xlsx) <span class="text-danger">*</span></label>
                    <div class="upload-box">
                        <i class="fa-solid fa-file-csv fa-2x text-success mb-2"></i>
                        <input type="file" id="dataFile" accept=".xlsx" class="form-control" required />
                        <small class="text-muted d-block mt-1">Hàng 1 chứa tên cột tương ứng {{TenBiên}}</small>
                    </div>
                </div>

                <!-- Word File Upload (Tùy chọn) -->
                <div class="col-md-6">
                    <label class="form-label fw-semibold"><i class="fa-solid fa-file-word text-primary me-2"></i>2. Tệp Word Mẫu Custom (.docx)</label>
                    <div class="upload-box">
                        <i class="fa-solid fa-cloud-arrow-up fa-2x text-primary mb-2"></i>
                        <input type="file" id="templateFile" accept=".docx" class="form-control" />
                        <small class="text-muted d-block mt-1">Tùy chọn (Bỏ trống nếu dùng mẫu lưu trên server)</small>
                    </div>
                </div>
            </div>

            <!-- Configurations -->
            <div class="row g-3 mb-4 bg-light p-3 rounded">
                <div class="col-md-6">
                    <label class="form-label fw-semibold"><i class="fa-solid fa-signature me-2"></i>Cột Excel dùng đặt tên file:</label>
                    <input type="text" id="filenameColumn" placeholder="Ví dụ: HoTen hoặc MaSV (Tùy chọn)" class="form-control" />
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold"><i class="fa-solid fa-file-export me-2"></i>Định dạng xuất kết quả:</label>
                    <select id="exportMode" class="form-select">
                        <option value="zip">Xuất từng file riêng lẻ đóng gói ZIP</option>
                        <option value="single_doc">Trộn tất cả gộp vào 1 file Word duy nhất</option>
                    </select>
                </div>
            </div>

            <!-- Submit Button -->
            <div class="text-center">
                <button type="submit" id="submitBtn" class="btn btn-success btn-lg px-5 shadow-sm">
                    <i class="fa-solid fa-gears me-2"></i>Thực Hiện Trộn Dữ Liệu
                </button>
            </div>
        </form>
    </div>

    <!-- Excel Preview Section (DataTables) -->
    <div id="previewCard" class="card card-custom p-4 d-none">
        <h5 class="fw-bold text-secondary mb-3"><i class="fa-solid fa-table me-2"></i>Xem Trước Dữ Liệu Excel (DataTables)</h5>
        <div class="table-responsive">
            <table id="excelDataTable" class="table table-striped table-hover table-bordered w-100">
                <thead><tr id="tableHeader"></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </div>
</div>

<!-- JS Libraries -->
<script src="https://code.jquery.com/jquery-3.7.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/jquery.dataTables.min.js"></script>
<script src="https://cdn.datatables.net/1.13.7/js/dataTables.bootstrap5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<!-- SweetAlert2 JS -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    let dataTableInstance = null;

    // Xem trước dữ liệu Excel
    document.getElementById('dataFile').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(event) {
            const data = new Uint8Array(event.target.result);
            const workbook = XLSX.read(data, {type: 'array'});
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const jsonData = XLSX.utils.sheet_to_json(worksheet, {header: 1});

            if (jsonData.length > 0) {
                if (dataTableInstance) {
                    dataTableInstance.destroy();
                    \$('#excelDataTable').empty();
                }

                const headers = jsonData[0];
                const rows = jsonData.slice(1);

                let headerHtml = '<tr>';
                headers.forEach(h => headerHtml += `<th>${h || ''}</th>`);
                headerHtml += '</tr>';

                let bodyHtml = '';
                rows.forEach(r => {
                    if (r.length > 0) {
                        bodyHtml += '<tr>';
                        headers.forEach((_, idx) => bodyHtml += `<td>${r[idx] !== undefined ? r[idx] : ''}</td>`);
                        bodyHtml += '</tr>';
                    }
                });

                document.getElementById('excelDataTable').innerHTML = `<thead>${headerHtml}</thead><tbody>${bodyHtml}</tbody>`;
                document.getElementById('previewCard').classList.remove('d-none');

                dataTableInstance = \$('#excelDataTable').DataTable({
                    language: {
                        search: "<i class='fa-solid fa-magnifying-glass me-1'></i>Tìm kiếm:",
                        lengthMenu: "Hiển thị _MENU_ dòng",
                        info: "Đang xem _START_ đến _END_ trong tổng số _TOTAL_ dòng",
                        paginate: { first: "Đầu", last: "Cuối", next: "Sau", previous: "Trước" }
                    },
                    pageLength: 5,
                    lengthMenu: [5, 10, 25, 50]
                });
            }
        };
        reader.readAsArrayBuffer(file);
    });

    // Gửi Form xử lý trộn dữ liệu
    document.getElementById('mergeForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const dataFile = document.getElementById('dataFile').files[0];
        const templateFile = document.getElementById('templateFile').files[0];
        const filenameColumn = document.getElementById('filenameColumn').value.trim();
        const exportMode = document.getElementById('exportMode').value;
        const submitBtn = document.getElementById('submitBtn');

        const formData = new FormData();
        formData.append('data_file', dataFile);
        formData.append('export_mode', exportMode);
        if (templateFile) formData.append('template_file', templateFile);
        if (filenameColumn) formData.append('filename_column', filenameColumn);

        // Hiển thị SweetAlert2 Loading
        Swal.fire({
            title: 'Đang xử lý dữ liệu...',
            text: 'Hệ thống đang trộn biểu mẫu, vui lòng chờ trong giây lát.',
            icon: 'info',
            allowOutsideClick: false,
            showConfirmButton: false,
            willOpen: () => {
                Swal.showLoading();
            }
        });

        submitBtn.disabled = true;

        const apiUrl = window.location.hostname.includes('github.io') 
            ? 'https://mail-merge-vercel.vercel.app/api/merge' 
            : '/api/merge';

        try {
            const response = await fetch(apiUrl, {
                method: 'POST',
                body: formData
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.detail || 'Có lỗi xảy ra trong quá trình trộn!');
            }

            const blob = await response.blob();
            const downloadUrl = window.URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = downloadUrl;
            a.download = exportMode === 'zip' ? 'Mail_Merge_Results.zip' : 'Mail_Merge_Merged.docx';
            document.body.appendChild(a);
            a.click();
            a.remove();

            // Thông báo thành công SweetAlert2
            Swal.fire({
                title: 'Thành Công!',
                text: 'Trộn biểu mẫu thành công và đã tự động tải về tệp kết quả.',
                icon: 'success',
                confirmButtonText: 'Đóng',
                confirmButtonColor: '#198754'
            });

        } catch (err) {
            // Thông báo lỗi SweetAlert2
            Swal.fire({
                title: 'Lỗi Xử Lý!',
                text: err.message,
                icon: 'error',
                confirmButtonText: 'Thử lại',
                confirmButtonColor: '#dc3545'
            });
        } finally {
            submitBtn.disabled = false;
        }
    });
</script>
</body>
</html>
